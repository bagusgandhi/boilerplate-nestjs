<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UCOAL Resources</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f8ff; font-family: Arial, sans-serif;">
    <center>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f8ff">
        <tr>
          <td align="center" style="padding: 20px 10px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 12px; padding: 40px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
              
              <!-- Logo -->
              <tr>
                <td align="center" style="padding-bottom: 20px;">
                  <img src="https://www.ucoal.co.id/templates/core/img/logo-ucoal-new.png" alt="Logo UCOAL Resources" style="max-width: 140px; height: auto;" />
                </td>
              </tr>

              <!-- Greeting and Message -->
              <tr>
                <td style="font-size: 16px; color: #555555; line-height: 1.6;">
                  Hai <strong style="color: #244a8d;">{{userName}}</strong>,<br /><br />
                  Kami ingin mengingatkan Anda bahwa dokumen <strong style="color: #244a8d;">{{type}}</strong> akan segera berakhir. Silakan periksa detail di bawah ini:
                </td>
              </tr>

              <!-- Contract Details -->
              <tr>
                <td style="padding-top: 20px;">
                  <table width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="padding: 8px; font-size: 14px; color: #7f8ae4;">No Kontrak</td>
                      <td style="padding: 8px; font-size: 14px; color: #7f8ae4;">: <strong style="color: #244a8d;">{{number}}</strong></td>
                    </tr>
                    <tr>
                      <td style="padding: 8px; font-size: 14px; color: #7f8ae4;">Judul</td>
                      <td style="padding: 8px; font-size: 14px; color: #7f8ae4;">: <strong style="color: #244a8d;">{{title}}</strong></td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Button -->
              <tr>
                <td align="center" style="padding-top: 20px;">
                  <a href="{{url}}" style="display: inline-block; padding: 10px 20px; background-color: #3ffe75; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold;">Lihat Detail</a>
                </td>
              </tr>

              <!-- Description -->
              <tr>
                <td style="padding-top: 20px; font-size: 16px; color: #555555;">
                  <strong style="color: #244a8d;">Deskripsi:</strong><br />
                  {{description}}
                </td>
              </tr>

            </table>
          </td>
        </tr>
      </table>
    </center>
  </body>
</html>
