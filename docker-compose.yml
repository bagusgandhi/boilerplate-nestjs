version: '3.8'

services:
  backend:
    container_name: boilerplate-nestjs
    build: .
    ports:
      - "8089:8000"
    restart: always
    env_file:
      - .env
  redis:
    image: redis:latest
    container_name: my-redis
    restart: always
    ports:
      - '6379:6379'
    expose:
      - '6379'

  bullboard:
    container_name: bullboard
    image: deadly0/bull-board
    restart: always
    ports:
      - 3003:3000
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # REDIS_PASSWORD: example-password
      REDIS_USE_TLS: 'false'
      BULL_PREFIX: bull
    depends_on:
      - redis

